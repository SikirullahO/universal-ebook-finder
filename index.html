<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Universal E-Book Finder</title>
  <meta name="description" content="Search tens of thousands of free, public-domain e-books from Project Gutenberg, with covers and author biographies.">
  <meta name="theme-color" content="#0c1220">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead__inner">
      <h1 class="brand">Universal <span>E-Book</span> Finder</h1>
      <p class="tagline">Free public-domain books from Project Gutenberg, ready to download.</p>
    </div>
  </header>

  <section class="search-bar" aria-label="Book search">
    <form class="search" id="search-form" role="search">
      <div class="field field--query">
        <label for="query">Title or author</label>
        <input id="query" name="query" type="search" placeholder="Try “Frankenstein” or “Jane Austen”" autocomplete="off" maxlength="120">
      </div>
      <div class="field field--language">
        <label for="language">Language</label>
        <select id="language" name="language">
          <option value="">Any language</option>
          <option value="en">English</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="es">Spanish</option>
          <option value="it">Italian</option>
          <option value="pt">Portuguese</option>
          <option value="nl">Dutch</option>
          <option value="fi">Finnish</option>
          <option value="sv">Swedish</option>
          <option value="da">Danish</option>
          <option value="no">Norwegian</option>
          <option value="pl">Polish</option>
          <option value="ru">Russian</option>
          <option value="el">Greek</option>
          <option value="la">Latin</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
          <option value="eo">Esperanto</option>
        </select>
      </div>
      <button class="button button--primary search__submit" type="submit">Search</button>
    </form>
  </section>

  <main class="results">
    <div class="results__header">
      <h2 class="results__title" id="results-title">Most downloaded</h2>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>

    <p class="notice" id="notice" hidden></p>

    <section class="message" id="message" role="alert" hidden>
      <h3 class="message__title" id="message-title"></h3>
      <p class="message__body" id="message-body"></p>
      <button class="button button--primary" id="message-action" type="button"></button>
    </section>

    <section class="book-grid" id="book-grid" aria-labelledby="results-title"></section>

    <div class="pager">
      <p class="pager__error" id="pager-error" role="alert" hidden></p>
      <button class="button button--ghost" id="load-more" type="button" hidden>Load more books</button>
    </div>
  </main>

  <footer class="site-footer">
    <p>
      Books and metadata from <a href="https://www.gutenberg.org/" rel="noopener" target="_blank">Project Gutenberg</a>
      via <a href="https://gutendex.com/" rel="noopener" target="_blank">Gutendex</a>.
      Covers from <a href="https://openlibrary.org/" rel="noopener" target="_blank">Open Library</a>.
      Biographies from <a href="https://www.wikipedia.org/" rel="noopener" target="_blank">Wikipedia</a> (CC BY-SA).
    </p>
  </footer>

  <template id="book-card">
    <article class="book">
      <div class="book__cover-wrap">
        <div class="cover is-loading">
          <div class="cover__art" aria-hidden="true">
            <p class="cover__title"></p>
            <p class="cover__author"></p>
          </div>
          <img class="cover__image" alt="" hidden>
        </div>
      </div>
      <div class="book__body">
        <h3 class="book__title"></h3>
        <p class="book__author"></p>
        <ul class="book__meta">
          <li class="book__downloads"></li>
          <li class="book__languages"></li>
        </ul>
        <div class="book__formats"></div>
        <details class="bio">
          <summary class="bio__toggle">About the author</summary>
          <div class="bio__content" aria-live="polite"></div>
        </details>
      </div>
    </article>
  </template>

  <template id="skeleton-card">
    <div class="book book--skeleton" aria-hidden="true">
      <div class="book__cover-wrap"><div class="cover shimmer"></div></div>
      <div class="book__body">
        <div class="bar bar--title shimmer"></div>
        <div class="bar bar--short shimmer"></div>
        <div class="bar bar--meta shimmer"></div>
        <div class="bar bar--button shimmer"></div>
      </div>
    </div>
  </template>
</body>
</html>
